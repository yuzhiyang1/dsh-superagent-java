name: Java 21 and browser acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test the actual Java implementation
        run: mvn -B verify
      - name: Install browser QA dependencies
        working-directory: scripts/ui-e2e
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Exercise real management UI against seeded SQLite and Engine
        working-directory: scripts/ui-e2e
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-browser-acceptance
          path: |
            scripts/ui-e2e/playwright-report
            scripts/ui-e2e/test-results
            scripts/ui-e2e/results.xml
            target/surefire-reports
          retention-days: 7
